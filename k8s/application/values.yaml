nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

gateway:
  replicaCount: 2
  image:
    repository: 637423245256.dkr.ecr.ap-south-1.amazonaws.com/demo/gateway
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
  resources: {}

products:
  replicaCount: 1
  image:
    repository: 637423245256.dkr.ecr.ap-south-1.amazonaws.com/demo/product
    tag: "v1.0.0"
