{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.secretName" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.keys.username }}: {{ .Values.auth.username | quote }}
  {{ .Values.auth.keys.password }}: {{ required "Set auth.password or provide auth.existingSecret" .Values.auth.password | quote }}
  {{ .Values.auth.keys.database }}: {{ .Values.auth.database | quote }}
{{- end }}
