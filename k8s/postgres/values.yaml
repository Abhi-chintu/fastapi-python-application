nameOverride: ""
fullnameOverride: ""

image:
  repository: postgres
  tag: 16-alpine
  pullPolicy: IfNotPresent

auth:
  username: appuser
  database: products
  password: ""
  existingSecret: ""
  keys:
    username: POSTGRES_USER
    password: POSTGRES_PASSWORD
    database: POSTGRES_DB

service:
  type: ClusterIP
  port: 5432

persistence:
  enabled: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi

resources: {}
