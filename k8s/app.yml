apiVersion: v1
kind: Namespace
metadata:
  name: python-microservices
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: python-microservices
type: Opaque
stringData:
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: CHANGE_ME_BEFORE_DEPLOYING
  POSTGRES_DB: products
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: python-microservices
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: python-microservices
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: python-microservices
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_USER}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}}
        - name: POSTGRES_DB
          valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_DB}}
        volumeMounts:
        - {name: postgres-storage, mountPath: /var/lib/postgresql/data}
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products
  namespace: python-microservices
spec:
  replicas: 1
  selector:
    matchLabels: {app: products}
  template:
    metadata:
      labels: {app: products}
    spec:
      containers:
      - name: products
        image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/python-eks-products:1.0
        ports: [{containerPort: 8001}]
        env:
        - {name: DB_HOST, value: postgres}
        - {name: DB_PORT, value: "5432"}
        - name: DB_NAME
          valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_DB}}
        - name: DB_USER
          valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_USER}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}}
        readinessProbe:
          httpGet: {path: /health, port: 8001}
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: products
  namespace: python-microservices
spec:
  selector: {app: products}
  ports: [{port: 8001, targetPort: 8001}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: python-microservices
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
      - name: gateway
        image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/python-eks-gateway:1.0
        ports: [{containerPort: 8000}]
        env:
        - {name: PRODUCTS_URL, value: http://products:8001}
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: python-microservices
spec:
  type: LoadBalancer
  selector: {app: gateway}
  ports: [{port: 80, targetPort: 8000}]
